function tone(f,d,ty,v,f2,at=.005){if(!AC||!mu)return;const t=AC.currentTime,o=AC.createOscillator(),q=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);q.gain.setValueAtTime(.0001,t);q.gain.exponentialRampToValueAtTime(v,t+at);q.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(q);q.connect(bus);o.start(t);o.stop(t+d+.05)}
